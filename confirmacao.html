<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/lucide@latest"></script>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DABF - Saída Liberada</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <main class="container">

        <header>

            <img
                src="assets/LOGO DABF-REMOV.png"
                alt="DABF"
                class="logo"
            >

        </header>


        <section class="confirmacao">

            <div class="icone-sucesso">
                ✓
            </div>


            <h2>
                SAÍDA LIBERADA
            </h2>

            <p>
                Na saída, a câmera reconhecerá sua placa
                e a cancela abrirá automaticamente.
            </p>

        </section>


        <section class="dados-confirmacao">

            <div class="info-confirmacao">

                <i data-lucide="car"></i>

                <div>
                    <span>Placa</span>
                    <strong id="placa">---</strong>
                </div>

            </div>


            <div class="info-confirmacao">

                <i data-lucide="square-parking"></i>

                <div>
                    <span>Vaga</span>
                    <strong id="vaga">---</strong>
                </div>

            </div>


            <div class="info-confirmacao">

                <i data-lucide="ticket"></i>

                <div>
                    <span>Ticket Nº</span>
                    <strong id="numeroTicket">---</strong>
                </div>

            </div>


            <div class="info-confirmacao">

                <i data-lucide="wallet-cards"></i>

                <div>
                    <span>Forma de pagamento</span>
                    <strong id="formaPagamento">---</strong>
                </div>

            </div>


            <div class="info-confirmacao">

                <i data-lucide="coins"></i>

                <div>
                    <span>Valor Pago</span>
                    <strong id="valorPago">---</strong>
                </div>

            </div>


            <div class="info-confirmacao">

                <i data-lucide="circle-check"></i>

                <div>
                    <span>Status</span>
                    <strong class="status-pago">
                        Pago
                    </strong>
                </div>

            </div>

        </section>


        <section class="liberacao-automatica">

            <div class="liberacao-icone">
                <i data-lucide="circle-check"></i>
            </div>

            <div class="liberacao-conteudo">

                <strong>
                    Liberação automática por placa
                </strong>

                <p>
                    Sua saída será liberada automaticamente
                    pela leitura da placa do veículo.
                </p>

            </div>

        </section>


        <button id="finalizar">

            FINALIZAR

        </button>

    </main>


    <script src="js/confirmacao.js"></script><script>
    lucide.createIcons();
    </script>

</body>

</html>
